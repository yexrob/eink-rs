[package]
name = "eink-rs"
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
description = "Components, a CLI framework and an in-app router for ink-rs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yexrob/eink-rs"
readme = "README.md"
keywords = ["tui", "terminal", "cli", "components", "ink"]
categories = ["command-line-interface"]
exclude = ["/docs", "/CLAUDE.md", "/AGENTS.md", "/.gitignore", "/.github"]

[package.metadata.docs.rs]
all-features = true

[workspace]
members = ["macros", "examples/file-routes", "examples/ship", "examples/quill"]
resolver = "3"

[features]
default = []
cli = ["dep:clap", "dep:eink-rs-macros"]
router = ["dep:eink-rs-macros"]
completion = ["cli", "dep:clap_complete"]
tokio = ["cli", "ink-rs/tokio"]
markdown = ["dep:pulldown-cmark"]
highlight = ["dep:syntect", "dep:two-face"]
markdown-highlight = ["markdown", "highlight"]
markdown-image = ["markdown", "image"]
image = ["dep:image"]
image-http = ["image", "dep:ureq"]
image-svg = ["image", "dep:resvg"]
video = ["image"]

[dependencies]
clap = { version = "4", optional = true, features = ["derive"] }
clap_complete = { version = "4", optional = true }
eink-rs-macros = { version = "0.2.0", path = "macros", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ink-rs = { version = "0.1.7", default-features = false, features = ["macros"] }
pulldown-cmark = { version = "0.13", optional = true, default-features = false }
resvg = { version = "0.45", optional = true }
syntect = { version = "5.3", optional = true, default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5", optional = true, default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "1"
ureq = { version = "3", optional = true }

[dev-dependencies]
tokio = { version = "1.54", default-features = false, features = ["rt", "time", "macros"] }

[[example]]
name = "cli"
required-features = ["cli"]

[[example]]
name = "composer"

[[example]]
name = "cli-async"
required-features = ["tokio"]

[[example]]
name = "router"
required-features = ["cli", "router"]

[[example]]
name = "markdown"
required-features = ["markdown"]

[[example]]
name = "markdown-stress"
required-features = ["markdown"]

[[example]]
name = "focus-ring"

[[example]]
name = "code"
required-features = ["highlight"]

[[example]]
name = "image"
required-features = ["image"]

[[example]]
name = "video"
required-features = ["video"]
