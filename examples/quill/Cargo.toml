[package]
name = "quill"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "An inline coding assistant with a clock-driven simulated agent"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
eink-rs = { path = "../..", features = ["cli", "completion"] }
ink-rs = { version = "0.1.3", default-features = false, features = ["macros"] }
