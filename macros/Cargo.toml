[package]
name = "eink-rs-macros"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "The Commands and Routes derives and the routes! macro for eink-rs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yexrob/eink-rs"
keywords = ["tui", "terminal", "cli", "clap", "ink"]
categories = ["command-line-interface"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
