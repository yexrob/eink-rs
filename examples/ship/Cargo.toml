[package]
name = "ship"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A simulated deploy console with components, commands and directory routes"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
eink-rs = { path = "../..", features = ["cli", "router", "completion"] }
ink-rs = { version = "0.1.4", default-features = false, features = ["macros"] }
